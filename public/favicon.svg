<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crop This Label — 4x6 Thermal Label Icon">
  <!-- Exposed silicone backing liner under the peeled top-right corner -->
  <rect x="12" y="6" width="40" height="52" fill="#f4f2ef" stroke="#221f1c" stroke-width="2.5" stroke-dasharray="3.5 3.5" />
  <!-- Main 2:3 (4x6) thermal label sheet with 45-degree top-right corner peel -->
  <polygon points="12,6 35,6 52,23 52,58 12,58" fill="#fbfaf9" stroke="#221f1c" stroke-width="3.5" stroke-linejoin="miter" />
  <!-- Kraft Amber peeled 45-degree corner flap -->
  <polygon points="35,6 35,23 52,23" fill="#e9a95e" stroke="#221f1c" stroke-width="3.2" stroke-linejoin="bevel" />
  <!-- Carrier service priority block -->
  <rect x="18" y="13" width="11" height="10" fill="#221f1c" />
  <!-- Terracotta freight stamp rule -->
  <line x1="18" y1="28.5" x2="45" y2="28.5" stroke="#e0704a" stroke-width="3" stroke-linecap="square" />
  <!-- Recipient address rule -->
  <line x1="18" y1="34.5" x2="38" y2="34.5" stroke="#221f1c" stroke-width="2.5" stroke-linecap="square" />
  <!-- High-contrast vertical tracking barcode bars (crisp at 16x16 & 32x32) -->
  <path d="M18 41 V52 M22.5 41 V52 M26 41 V52 M30.5 41 V52 M35 41 V52 M38.5 41 V52 M43 41 V52 M46 41 V52" stroke="#221f1c" stroke-width="2.4" stroke-linecap="butt" />
</svg>
